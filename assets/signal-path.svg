<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="372" viewBox="0 0 1000 372" role="img" aria-labelledby="t d"><title id="t">Tech Kabaddi signal path</title><desc id="d">Pressure mat with about 2,700 cells, then embedded firmware on STM32H747 and Arduino Giga R1, then a FastAPI and WebSocket server on a Raspberry Pi 5, then the referee's browser. Latency fell from 120 ms to 15 ms, packets from about 8 KB to about 200 B. 243 automated tests, 11 releases in 3 weeks.</desc><style>.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.blink{animation:blink 1.1s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}.pk{opacity:0;animation:mv 1.5s linear infinite}.pk.raw{animation-name:mvraw}@keyframes mv{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(46px);opacity:0}}@keyframes mvraw{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(38px);opacity:0}}.led{opacity:.18;animation:led 1.8s linear infinite}@keyframes led{0%,30%{opacity:.95}60%,100%{opacity:.18}}.bar{transform-box:fill-box;transform-origin:0 50%}.g1{animation:g1 9s ease-out infinite}.g2{animation:g2 9s ease-out infinite}@keyframes g1{0%{transform:scaleX(0)}9%,100%{transform:scaleX(1)}}@keyframes g2{0%,11%{transform:scaleX(0)}16%,100%{transform:scaleX(1)}}.l1{animation:l1 9s infinite}.l2{animation:l2 9s infinite}@keyframes l1{0%,6%{opacity:0}9%,100%{opacity:1}}@keyframes l2{0%,13%{opacity:0}16%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{opacity:1!important}}</style><rect width="1000" height="372" rx="14" fill="#0a0d12"/><text x="20" y="38" class="sans" font-size="13" fill="#f59f00" font-weight="800" letter-spacing="2" >TECH KABADDI</text><text x="150" y="38" class="mono" font-size="12" fill="#8b98a9" >sensor → referee, end to end</text><text x="980" y="38" class="mono" font-size="12" fill="#4d5967" text-anchor="end" >patent filed · NAIN-funded · source private</text><rect x="20" y="58" width="195" height="140" rx="12" fill="#0e131a" stroke="#1c2430"/><text x="36" y="82" class="mono" font-size="11" fill="#f9b519" font-weight="700" letter-spacing="1" >01 · SENSE</text><text x="36" y="106" class="sans" font-size="16" fill="#e6edf3" font-weight="700" >Pressure mat</text><text x="36" y="130" class="mono" font-size="11" fill="#8b98a9" >3 sensing nodes</text><text x="36" y="147" class="mono" font-size="11" fill="#8b98a9" >~2,700 pressure cells</text><text x="36" y="164" class="mono" font-size="11" fill="#8b98a9" >boot-time calibration</text><rect class="led" x="36" y="182" width="8" height="4" rx="1" fill="#f9b519" style="animation-delay:0.00s"/><rect class="led" x="48" y="182" width="8" height="4" rx="1" fill="#f9b519" style="animation-delay:0.09s"/><rect class="led" x="60" y="182" width="8" height="4" rx="1" fill="#f9b519" style="animation-delay:0.18s"/><rect class="led" x="72" y="182" width="8" height="4" rx="1" fill="#f9b519" style="animation-delay:0.27s"/><rect class="led" x="84" y="182" width="8" height="4" rx="1" fill="#f9b519" style="animation-delay:0.36s"/><rect class="led" x="96" y="182" width="8" height="4" rx="1" fill="#f9b519" style="animation-delay:0.45s"/><rect class="led" x="108" y="182" width="8" height="4" rx="1" fill="#f9b519" style="animation-delay:0.54s"/><rect class="led" x="120" y="182" width="8" height="4" rx="1" fill="#f9b519" style="animation-delay:0.63s"/><rect class="led" x="132" y="182" width="8" height="4" rx="1" fill="#f9b519" style="animation-delay:0.72s"/><rect class="led" x="144" y="182" width="8" height="4" rx="1" fill="#f9b519" style="animation-delay:0.81s"/><rect class="led" x="156" y="182" width="8" height="4" rx="1" fill="#f9b519" style="animation-delay:0.90s"/><rect class="led" x="168" y="182" width="8" height="4" rx="1" fill="#f9b519" style="animation-delay:0.99s"/><rect class="led" x="180" y="18