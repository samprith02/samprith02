<svg xmlns="http://www.w3.org/2000/svg" width="500" height="262" viewBox="0 0 500 262" role="img" aria-labelledby="t d"><title id="t">Federated Learning</title><desc id="d">Federated learning research framework: FedAvg and FedProx implemented from scratch, 100 simulated clients on CIFAR-10. At alpha 0.1, FedProx reaches 36.6% final accuracy against FedAvg's 22.1% (curve shapes are illustrative; the final values come from the repo).</desc><style>.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.blink{animation:blink 1.1s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}.cv{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 8s ease-out infinite}@keyframes draw{0%{stroke-dashoffset:100}40%,100%{stroke-dashoffset:0}}.end{opacity:0;animation:endl 8s infinite}@keyframes endl{0%,40%{opacity:0}44%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.cv{stroke-dashoffset:0!important}.end{opacity:1!important}}</style><rect width="500" height="262" rx="14" fill="#0a0d12"/><text x="24" y="38" class="mono" font-size="11" fill="#22d3ee" font-weight="700" letter-spacing="1" >RESEARCH · PYTORCH</text><text x="300" y="40" class="sans" font-size="16" fill="#4d5967" text-anchor="end" >↗</text><text x="23" y="72" class="sans" font-size="26" fill="#e6edf3" font-weight="800" >Federated Learning</text><text x="24" y="98" class="sans" font-size="13.5" fill="#8b98a9" >FedAvg and FedProx from scratch:</text><text x="24" y="116" class="sans" font-size="13.5" fill="#8b98a9" >100 simulated clients on CIFAR-10,</text><text x="24" y="134" class="sans" font-size="13.5" fill="#8b98a9" >IID and Dirichlet non-IID splits.</text><text x="24" y="176" class="sans" font-size="22" fill="#e6edf3" font-weight="800" >99.02%</text><text x="24" y="193" class="mono" font-size="10" fill="#4d5967" >MNIST IID</text><text x="124" y="176" class